[project]
name = "notification-service"
version = "0.1.0"
description = "A centralized notification service built with FastAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "alembic>=1.19.0",
    "pytest-asyncio>=1.4.0",
]
